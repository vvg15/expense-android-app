# Builds the Android app on GitHub's computers every time you push to main
# (or when you press "Run workflow" on the Actions tab).
#
# Output:
#  • A GitHub Release "vX.Y.Z" with the installable APK attached (download it on
#    your phone from the repository's "Releases" page).
#  • An .aab file (artifact) — that's the file you upload to Google Play.
#
# Needs 4 repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.

name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to create the Release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Read app version
        id: version
        run: |
          V=$(grep -oP "APP_VERSION = '\K[0-9]+\.[0-9]+\.[0-9]+" web/version.js)
          [ -n "$V" ] || { echo "::error::Couldn't read APP_VERSION from web/version.js"; exit 1; }
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "App version $V"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret KEYSTORE_BASE64. Add the 4 signing secrets (see README → 'Set up GitHub')."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build APK and App Bundle
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Name the files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ExpenseManager-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/ExpenseManager-${{ steps.version.outputs.name }}.aab"
          ls -la dist

      - name: Upload App Bundle (for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseManager-${{ steps.version.outputs.name }}-google-play
          path: dist/*.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseManager-${{ steps.version.outputs.name }}-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.name }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" dist/*.apk --clobber
          else
            gh release create "v$V" dist/*.apk --title "Expense Manager $V" \
              --notes "Install on Android: download the .apk below on your phone and open it. Updating keeps your data. See CHANGELOG.md for what's new."
          fi
